name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create/update (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests & build Debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare named APK
        env:
          REL_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "FourWinsTactical-${REL_TAG}.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FourWinsTactical-APK
          path: FourWinsTactical-*.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          name: "4Wins Tactical ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }} (Android APK)"
          body: "Personal 4 Daily Wins & Knee-Safe Darebee Fitness Android App (Offline + Online). Download and install the attached `.apk` on Android 8.0+."
          files: FourWinsTactical-*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
